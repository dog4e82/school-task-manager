# Free web service. Persistent account state and analysis live in external PostgreSQL.
services:
  - type: web
    name: moa-classroom
    repo: https://github.com/dog4e82/school-task-manager
    branch: moa-classroom-web
    runtime: python
    plan: free
    domains:
      - app.moa-classroom.dynv6.net
    buildCommand: uv sync --frozen --no-dev --no-install-project
    startCommand: uv run --no-sync webapp.py serve --host 0.0.0.0
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: APP_DATA_DIR
        value: /tmp/moa
      - key: APP_BASE_URL
        value: https://app.moa-classroom.dynv6.net
      - key: DATABASE_URL
        sync: false
      - key: APP_TOKEN_KEY
        sync: false
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: GOOGLE_WEB_CLIENT_SECRET
        sync: false
      - key: WEB_AI_ENABLED
        value: "false"
      - key: WEB_AI_DAILY_LIMIT
        value: "3"
      - key: WEB_AI_GLOBAL_DAILY_LIMIT
        value: "30"
  # Public information has no application startup or database dependency.
  # Static sites are free; there is no paid instance, disk or new database.
  - type: web
    name: moa-info
    repo: https://github.com/dog4e82/school-task-manager
    branch: moa-classroom-web
    runtime: static
    domains:
      - info.moa-classroom.dynv6.net
    buildCommand: "true"
    staticPublishPath: ./public-site
    routes:
      - type: rewrite
        source: /privacy
        destination: /privacy/index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; style-src 'self'; base-uri 'none'; frame-ancestors 'none'"
