# Free web service. Persistent account state and analysis live in external PostgreSQL.
services:
  - type: web
    name: moa-classroom
    repo: https://github.com/dog4e82/school-task-manager
    branch: moa-classroom-web
    runtime: python
    plan: free
    buildCommand: uv sync --frozen --no-dev --no-install-project
    startCommand: uv run --no-sync webapp.py serve --host 0.0.0.0
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: APP_DATA_DIR
        value: /tmp/moa
      - key: DATABASE_URL
        sync: false
      - key: APP_TOKEN_KEY
        sync: false
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: GOOGLE_WEB_CLIENT_SECRET
        sync: false
      - key: WEB_AI_ENABLED
        value: "false"
      - key: WEB_AI_DAILY_LIMIT
        value: "3"
      - key: WEB_AI_GLOBAL_DAILY_LIMIT
        value: "30"
