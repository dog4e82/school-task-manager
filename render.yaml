# Persistent storage is required for account sessions, encrypted OAuth tokens and records.
# This blueprint uses a paid disk-compatible service; creating it requires the owner's billing approval.
services:
  - type: web
    name: moa-classroom
    repo: https://github.com/dog4e82/school-task-manager
    branch: moa-classroom-web
    runtime: python
    plan: starter
    buildCommand: uv sync --frozen --no-dev --no-install-project
    startCommand: uv run --no-sync webapp.py serve --host 0.0.0.0
    healthCheckPath: /health
    disk:
      name: moa-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: APP_DATA_DIR
        value: /var/data
      - key: APP_BASE_URL
        sync: false
      - key: APP_TOKEN_KEY
        sync: false
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: GOOGLE_WEB_CLIENT_SECRET
        sync: false
      - key: WEB_AI_ENABLED
        value: "false"
      - key: WEB_AI_DAILY_LIMIT
        value: "3"
      - key: WEB_AI_GLOBAL_DAILY_LIMIT
        value: "30"
