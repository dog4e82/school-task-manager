<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src {{CONNECT_SRC}}; style-src 'unsafe-inline'; script-src 'sha256-{{SCRIPT_HASH}}'; base-uri 'none'; form-action 'none'">
  <title>모아 · 학교 과제 한눈에</title>
  <style>{{STYLE}}</style>
</head>
<body>
  <a class="skip" href="#main">본문 바로가기</a>
  <button id="mobile-mask" class="mobile-mask" aria-label="메뉴 닫기" hidden></button>
  <aside class="sidebar" id="sidebar" aria-label="주 메뉴">
    <button id="mobile-close" class="icon-button mobile-close" aria-label="메뉴 닫기"><span data-icon="x"></span></button>
    <a class="brand" href="#dashboard"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>모아<span class="brand-dot">.</span></span></a>
    <div class="workspace"><div class="workspace-icon" data-icon="school"></div><div><strong>우리 학교 과제</strong><span>나의 학습 공간</span></div><span class="workspace-chevron" data-icon="chevrons"></span></div>
    <p class="nav-label">내 학습 공간</p>
    <nav id="navigation">
      <button data-view="dashboard" class="nav-item active"><span data-icon="grid"></span>대시보드</button>
      <button data-view="all" class="nav-item"><span data-icon="list"></span>전체 일정<span class="nav-count" id="all-count"></span></button>
      <button data-view="opportunities" class="nav-item"><span data-icon="trophy"></span>대회·선택 활동<span class="nav-count" id="opportunity-count"></span></button>
      <button data-view="calendar" class="nav-item"><span data-icon="calendar"></span>캘린더</button>
      <button data-view="library" class="nav-item"><span data-icon="book"></span>공지·자료</button>
      <button data-view="done" class="nav-item"><span data-icon="check-circle"></span>완료한 할 일</button>
    </nav>
    <div class="courses-heading"><p class="nav-label">연결된 수업</p><span class="tiny-count" id="course-total"></span></div>
    <div id="course-list" class="course-list"></div>
    <button class="more-courses" id="more-courses">수업 모두 보기 <span data-icon="down"></span></button>
    <div class="sidebar-bottom"><div class="save-status"><span class="live-dot"></span>저장된 자료와 연결됨</div><button class="profile" id="profile-button"><span class="avatar">나</span><span><strong>내 Classroom</strong><small>이 브라우저의 개인 공간</small></span><span data-icon="info"></span></button></div>
  </aside>
  <div class="shell">
    <header class="topbar"><div class="top-left"><button class="icon-button mobile-menu" id="mobile-menu" aria-label="메뉴 열기" aria-controls="sidebar" aria-expanded="false"><span data-icon="menu"></span></button><span class="breadcrumb">내 학습 공간 <span>/</span> <strong id="breadcrumb-current">대시보드</strong></span></div><div class="top-right"><label class="global-search"><span data-icon="search"></span><input id="search" type="search" placeholder="과제, 수업, 자료 검색" aria-label="과제, 수업, 자료 검색"><kbd>Ctrl K</kbd></label><button class="icon-button info-button" id="info-button" aria-label="저장 데이터 정보"><span data-icon="clock"></span></button><span class="top-avatar">나</span></div></header>
    <main id="main" tabindex="-1">
      <section class="page-heading"><div><h1 id="page-title">나의 학습 보드</h1><p id="page-description">해야 할 과제부터, 도전하고 싶은 활동까지.</p></div><div class="today-pill"><span data-icon="calendar"></span><span id="today-label"></span></div></section>
      <div class="stats-grid" id="stats-grid"></div>
      <section id="visual-planner" class="visual-planner" aria-label="가까운 과제와 7일 기한 보드"></section>
      <div class="content-grid" id="content-grid">
        <section class="primary-panel" aria-label="과제 목록">
          <div class="panel-heading"><div><h2 id="list-title">다가오는 과제</h2><span class="list-subtitle" id="list-subtitle"></span></div><div class="sort-control"><span data-icon="sort"></span><select id="sort" aria-label="정렬"><option value="due">마감 가까운 순</option><option value="course">수업별</option><option value="title">제목순</option></select></div></div>
          <div class="filters" id="filters"></div>
          <div class="selection-strip" id="selection-strip" hidden></div>
          <div id="task-list" class="task-list"></div>
          <div id="library-list" class="library-list" hidden></div>
          <div id="full-calendar" class="full-calendar" hidden></div>
          <div class="list-footer" id="list-footer"></div>
        </section>
        <aside class="right-column" aria-label="일정과 데이터 정보">
          <section class="calendar-panel"><div class="calendar-heading"><h2 id="calendar-heading"></h2><div><button class="calendar-arrow" id="month-prev" aria-label="이전 달"><span data-icon="left"></span></button><button class="calendar-arrow" id="month-next" aria-label="다음 달"><span data-icon="right"></span></button></div></div><div class="weekdays"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div id="mini-calendar" class="mini-calendar"></div><div class="calendar-legend"><span><i></i>과제·신청 기한</span><button id="calendar-reset">오늘로 돌아가기</button></div></section>
          <section class="agenda-panel"><div class="side-panel-heading"><h2>다가오는 일정</h2><span data-icon="arrow-up-right"></span></div><div id="agenda"></div></section>
          <button class="opportunity-shortcut" data-view="opportunities"><span class="shortcut-art" data-icon="trophy"></span><span><strong>나에게 맞는 다음 도전</strong><small id="opportunity-summary">대회·모집 안내를 모았어요.</small><span class="shortcut-link">선택 활동 둘러보기 <span data-icon="arrow"></span></span></span></button>
          <section class="analysis-panel"><div class="analysis-icon" data-icon="sparkles"></div><h2>원문과 함께 확인하세요</h2><p>AI가 정리한 할 일과 원래 등록된 기한을 구분해 보여 드려요.</p><div class="analysis-progress"><span id="analysis-count"></span><strong id="analysis-percent"></strong></div><div class="progress-track"><i id="analysis-bar"></i></div><p class="analysis-note" id="analysis-note"></p></section>
        </aside>
      </div>
      <footer class="page-footer"><span><span class="small-dot"></span>완료 표시와 메모는 이 브라우저에 저장돼요.</span><span id="snapshot-label"></span></footer>
    </main>
  </div>
  <dialog id="info-dialog" class="info-dialog" aria-labelledby="info-title"><button class="dialog-close icon-button" id="close-info" aria-label="정보 닫기"><span data-icon="x"></span></button><span class="info-kicker">저장 데이터</span><h2 id="info-title">현재 연결된 내용</h2><div id="info-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script id="app-data" type="application/json">{{DATA}}</script>
  <script>{{SCRIPT}}</script>
</body>
</html>
